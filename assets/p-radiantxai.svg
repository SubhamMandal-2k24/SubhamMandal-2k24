<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="232" viewBox="0 0 1000 232" role="img"><style>@font-face{font-family:'PJ800';font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}.h8{font-family:'PJ800','Plus Jakarta Sans','Segoe UI',Arial,sans-serif;font-weight:800}@font-face{font-family:'PJ400';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}.b4{font-family:'PJ400','Plus Jakarta Sans','Segoe UI',Arial,sans-serif;font-weight:400}@font-face{font-family:'JB400';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}.jm{font-family:'JB400','JetBrains Mono',Consolas,monospace;font-weight:400}</style><defs><clipPath id="clip"><rect width="1000" height="232" rx="20"/></clipPath><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".1"/></pattern><linearGradient id="mg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4ee3b6"/><stop offset="1" stop-color="#ffc861"/></linearGradient><linearGradient id="tg1" x1="0" x2="1"><stop offset="0" stop-color="#4ee3b6"/><stop offset="1" stop-color="#4ee3b6" stop-opacity="0"/></linearGradient><radialGradient id="heat"><stop offset="0" stop-color="#ffc861" stop-opacity=".9"/><stop offset=".55" stop-color="#ff7d6b" stop-opacity=".35"/><stop offset="1" stop-color="#ff7d6b" stop-opacity="0"/></radialGradient><radialGradient id="bl0"><stop offset="0" stop-color="#4ee3b6" stop-opacity="0.53"/><stop offset="1" stop-color="#4ee3b6" stop-opacity="0"/></radialGradient></defs><rect width="1000" height="232" rx="20" fill="#0a1218"/><g clip-path="url(#clip)"><circle cx="0" cy="232" r="217" fill="url(#bl0)"><animateTransform attributeName="transform" type="translate" values="0 0;30 -20;-12 12;0 0" dur="16s" repeatCount="indefinite"/></circle></g><rect x=".5" y=".5" width="999" height="231" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".1"/><g clip-path="url(#clip)"><rect x="24" y="0" width="450" height="3" rx